<!DOCTYPE html>

<body style="font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; line-height: 1.6;">
<h3 style="margin-top:0">파란전화기 설치</h3>
<p>같은 사무실 네트워크의 동료와 쪽지 · 1:1 대화 · 파일을 주고받는 메신저입니다. Windows 판 파란전화기와도 그대로 주고받을 수 있습니다.</p>
<p>설치가 끝나면 <b>응용 프로그램</b> 폴더에 <b>파란전화기</b>가 생기고 바로 실행됩니다.</p>
<ul>
<li>처음 실행할 때 <b>로컬 네트워크</b> 접근을 물으면 <b>허용</b>을 눌러 주세요. 그래야 동료가 보입니다.</li>
<li>화면 캡처(✂) 기능은 처음 쓸 때 <b>화면 기록</b> 권한을 요청합니다.</li>
</ul>
</body></html>

# main 브랜치에 올라오는 변경마다 빌드가 깨지지 않는지 확인하고 실행 파일을 아티팩트로 남김
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/BluePhone.csproj -c Release -nologo
      - uses: actions/upload-artifact@v4
        with:
          name: BluePhone-${{ github.sha }}
          path: src/bin/Release/net48/BluePhone.exe

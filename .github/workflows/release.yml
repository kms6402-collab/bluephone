# 태그(v*)를 올리면 빌드 → SHA-256 생성 → CHANGELOG 해당 항목을 노트로 GitHub 릴리스 발행
# 설치된 파란전화기는 이 릴리스를 보고 자동 업데이트한다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet build src/BluePhone.csproj -c Release -nologo "-p:Version=$v"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/bin/Release/net48/BluePhone.exe dist/BluePhone.exe
          $hash = (Get-FileHash dist/BluePhone.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/BluePhone.exe.sha256", "$hash  BluePhone.exe")
          $ver = (Get-Item dist/BluePhone.exe).VersionInfo.FileVersion
          Write-Host "FileVersion: $ver  SHA256: $hash"

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^##\s*\[?$([regex]::Escape($v))\]?[^\n]*\n(.*?)(?=^##\s|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "변경 사항은 CHANGELOG.md 를 참고하세요." }
          $notes += "`n`n---`n**설치/업데이트**: ``BluePhone.exe`` 를 받아 원하는 이름(예: 파란전화기.exe)으로 저장해 실행하세요. 이미 쓰고 있다면 프로그램이 자동으로 업데이트합니다."
          [IO.File]::WriteAllText("notes.md", $notes, [Text.UTF8Encoding]::new($false))

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/BluePhone.exe dist/BluePhone.exe.sha256 `
            --title "파란전화기 ${{ github.ref_name }}" --notes-file notes.md --latest

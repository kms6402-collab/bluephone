# 태그(v*)를 올리면 빌드 → (인증서가 등록돼 있으면) 코드 서명 → SHA-256 생성
# → CHANGELOG 해당 항목을 노트로 GitHub 릴리스 발행. 설치된 파란전화기는 이 릴리스를 보고 자동 업데이트한다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet build src/BluePhone.csproj -c Release -nologo "-p:Version=$v"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/bin/Release/net48/BluePhone.exe dist/BluePhone.exe

      # 선택: 저장소 Secrets 에 SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD 가 있으면 Authenticode 서명.
      # 신뢰된 인증서(SignPath Foundation 무료 OSS 인증서, 구매한 OV/EV 인증서 등)를 넣으면
      # '알 수 없는 게시자' 대신 게시자 이름이 표시된다. 없으면 이 단계는 건너뛴다.
      - name: Code sign (optional)
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { Write-Host "서명 인증서 없음 — 서명 생략"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p "$env:PFX_PASS" `
            /tr http://timestamp.digicert.com /td SHA256 /d "파란전화기" dist/BluePhone.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BluePhone.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/BluePhone.exe.sha256", "$hash  BluePhone.exe")
          $ver = (Get-Item dist/BluePhone.exe).VersionInfo.FileVersion
          Write-Host "FileVersion: $ver  SHA256: $hash"

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^##\s*\[?$([regex]::Escape($v))\]?[^\n]*\n(.*?)(?=^##\s|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "변경 사항은 CHANGELOG.md 를 참고하세요." }
          $notes += "`n`n---`n**설치 (보안 경고 없이)**: PowerShell 에 붙여 넣기`n`n``````powershell`nirm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex`n```````n`n이미 쓰고 있다면 프로그램이 자동으로 업데이트합니다. ``BluePhone.exe`` 를 직접 받아 원하는 이름으로 저장해 실행해도 됩니다.`n`n**macOS**: ``BluePhone-mac.pkg`` 를 받아 실행하면 응용 프로그램 폴더에 설치됩니다 (Apple Silicon · Intel 공용, macOS 12 이상). 서명되지 않은 설치 파일이라 처음에는 ``Control`` 을 누른 채 클릭 → **열기** 를 선택하거나, 시스템 설정 › 개인정보 보호 및 보안 에서 **확인 없이 열기** 를 눌러 주세요. 설치 후에는 자동으로 업데이트합니다."
          [IO.File]::WriteAllText("notes.md", $notes, [Text.UTF8Encoding]::new($false))

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/BluePhone.exe dist/BluePhone.exe.sha256 install.ps1 `
            --title "파란전화기 ${{ github.ref_name }}" --notes-file notes.md --latest

  # macOS 설치 파일 (BluePhone-mac.pkg): Windows 릴리스가 만들어진 뒤 같은 릴리스에 올린다.
  # 맥용 파란전화기는 이 파일을 보고 자동 업데이트한다.
  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 선택: Secrets 에 Apple 인증서가 있으면 Developer ID 서명 + 공증.
      #   MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD  (Developer ID Application · Installer 인증서를 함께 담은 .p12)
      #   MAC_APP_IDENTITY / MAC_INSTALLER_IDENTITY  (예: "Developer ID Application: 홍길동 (TEAMID)")
      #   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD  (공증용 앱 암호)
      # 없으면 ad-hoc 서명으로 만들고, 처음 열 때 '확인 없이 열기'가 필요하다.
      - name: Import signing certificate (optional)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "Apple 인증서 없음 — ad-hoc 서명"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"

      - name: Build pkg
        env:
          MAC_APP_IDENTITY: ${{ secrets.MAC_APP_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then unset MAC_APP_IDENTITY MAC_INSTALLER_IDENTITY; fi
          V="${GITHUB_REF_NAME#v}"
          bash mac/packaging/build-pkg.sh "$V"

      - name: Self test (published app + installed pkg)
        run: |
          mac/obj/pkg/stage-arm64/*.app/Contents/MacOS/BluePhone --selftest
          sudo installer -pkg dist/BluePhone-mac.pkg -target /
          APP=$(for a in /Applications/*.app; do [ -x "$a/Contents/MacOS/BluePhone" ] && echo "$a"; done | head -1)
          echo "설치됨: $APP"
          test -n "$APP"
          file "$APP/Contents/MacOS/BluePhone"
          "$APP/Contents/MacOS/BluePhone" --selftest
          pkill -x BluePhone || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/BluePhone-mac.pkg dist/BluePhone-mac.pkg.sha256 --clobber
